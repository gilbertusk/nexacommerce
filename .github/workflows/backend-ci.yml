name: Workspace CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build shared packages
        run: |
          npm run build --workspace=packages/common --if-present
          npm run build --workspace=packages/types --if-present
          npm run build --workspace=packages/config --if-present
          npm run build --workspace=packages/logger --if-present
          npm run build --workspace=packages/validation --if-present
          npm run build --workspace=packages/event-contracts --if-present
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Lint every workspace
        run: npm run lint

  test:
    name: Tests and migrations
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: nexacommerce_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: apache/kafka:4.3.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
          CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    env:
      CI: 'true'
      NODE_ENV: test
      TEST_DATABASE_BASE_URL: postgresql://postgres:postgres123@localhost:5432/nexacommerce_test_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-ci
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-ci
      INTERNAL_SERVICE_TOKEN: test-internal-service-token-at-least-32-characters
      KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build shared packages
        run: |
          npm run build --workspace=packages/common --if-present
          npm run build --workspace=packages/types --if-present
          npm run build --workspace=packages/config --if-present
          npm run build --workspace=packages/logger --if-present
          npm run build --workspace=packages/validation --if-present
          npm run build --workspace=packages/event-contracts --if-present
      - name: Provision Kafka stream topics
        shell: bash
        run: |
          set -euo pipefail
          # Automatic topic creation is disabled in production, so CI creates
          # the same topics the Event Stream Service provisions at startup.
          for topic in orders payments inventory shipping reviews; do
            docker run --rm --network host apache/kafka:4.3.1 \
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
              --create --if-not-exists --topic "nexacommerce.${topic}.v1" \
              --partitions 6 --replication-factor 1
          done

      - name: Deploy migrations and test database services
        shell: bash
        run: |
          set -euo pipefail
          services=(
            'auth-service:auth_test'
            'user-service:user_test'
            'product-service:product_test'
            'inventory-service:inventory_test'
            'order-service:order_test'
            'payment-service:payment_test'
            'voucher-service:voucher_test'
            'shipping-service:shipping_test'
            'review-service:review_test'
            'notification-service:notification_test'
            'analytics-service:analytics_test'
          )

          for entry in "${services[@]}"; do
            service="${entry%%:*}"
            schema="${entry##*:}"
            export DATABASE_URL="${TEST_DATABASE_BASE_URL}?schema=${schema}"
            echo "Deploying and testing ${service} in schema ${schema}"
            npx prisma migrate deploy --schema="apps/${service}/prisma/schema.prisma"
            npx prisma generate --schema="apps/${service}/prisma/schema.prisma"
            npm test --workspace="apps/${service}"
          done
      - name: Test non-database workspaces
        run: >-
          npm test
          --workspace=apps/api-gateway
          --workspace=apps/cart-service
          --workspace=apps/event-stream-service
          --workspace=packages/common
          --workspace=frontend/customer-web
          --workspace=frontend/seller-dashboard
          --workspace=frontend/admin-dashboard
          --if-present
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build every workspace
        run: npm run build
