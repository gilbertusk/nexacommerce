name: Container CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
      - 'docker-compose.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - product-service
          - cart-service
          - order-service
          - payment-service
          - inventory-service
          - voucher-service
          - shipping-service
          - review-service
          - notification-service
          - analytics-service
          - event-stream-service
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            -f apps/${{ matrix.service }}/Dockerfile \
            -t nexacommerce/${{ matrix.service }}:latest \
            .
      - name: Verify image
        run: docker image inspect nexacommerce/${{ matrix.service }}:latest

  test-compose:
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 35
    env:
      POSTGRES_PASSWORD: ci-postgres-password-32-characters
      REDIS_PASSWORD: ci-redis-password-32-characters
      RABBITMQ_USER: nexacommerce_ci
      RABBITMQ_PASSWORD: ci-rabbitmq-password-32-characters
      JWT_SECRET: ci-jwt-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      INTERNAL_SERVICE_TOKEN: ci-internal-token-at-least-32-characters
      MIDTRANS_SERVER_KEY: SB-Mid-server-ci-validation-only
      MIDTRANS_CLIENT_KEY: SB-Mid-client-ci-validation-only
      MIDTRANS_MERCHANT_ID: ci-merchant-validation-only
      SMTP_HOST: smtp.example.invalid
      SMTP_USER: ci-smtp-user
      SMTP_PASS: ci-smtp-password-32-characters
      SMTP_FROM: noreply@example.invalid
      CUSTOMER_WEB_URL: http://localhost:3020
      CORS_ORIGINS: http://localhost:3020,http://localhost:3021,http://localhost:3022
      MEDIA_S3_BUCKET: nexacommerce-ci-media
      MEDIA_S3_ACCESS_KEY_ID: ci-media-access-key
      MEDIA_S3_SECRET_ACCESS_KEY: ci-media-secret-key-32-characters
      MEDIA_PUBLIC_BASE_URL: https://media.example.invalid
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: docker compose --profile production config -q
      - name: Build and start all services
        run: |
          docker compose --profile production up -d --build
          sleep 30
      - name: Health check gateway
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error http://localhost:3000/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose --profile production ps
          docker compose --profile production logs --tail=100 api-gateway
          exit 1
      - name: Smoke test RabbitMQ to Kafka bridge
        run: |
          for attempt in $(seq 1 24); do
            if docker exec nexacommerce-event-stream wget -qO- http://localhost:3013/ready | grep -q '"ready":true'; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              docker compose --profile production logs --tail=100 event-stream-service kafka rabbitmq
              exit 1
            fi
            sleep 5
          done

          event_id="container-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload=$(printf '{"eventId":"%s","eventName":"OrderPaid","timestamp":"2026-01-01T00:00:00.000Z","payload":{"orderId":"order-container-ci","customerId":"customer-container-ci","paidAt":"2026-01-01T00:00:00.000Z","amount":1000}}' "$event_id")
          docker exec nexacommerce-rabbitmq rabbitmqadmin \
            -u "$RABBITMQ_USER" -p "$RABBITMQ_PASSWORD" \
            publish exchange=nexacommerce.events routing_key=order.paid payload="$payload"

          record=$(docker exec nexacommerce-kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 \
            --topic nexacommerce.orders.v1 \
            --from-beginning \
            --max-messages 1 \
            --timeout-ms 30000)
          echo "$record" | grep -F "\"eventId\":\"$event_id\""
      - name: Cleanup
        if: always()
        run: docker compose --profile production down -v
