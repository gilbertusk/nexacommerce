name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - product-service
          - cart-service
          - order-service
          - payment-service
          - inventory-service
          - voucher-service
          - shipping-service
          - review-service
          - notification-service
          - analytics-service
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            -f apps/${{ matrix.service }}/Dockerfile \
            -t nexacommerce/${{ matrix.service }}:latest \
            .
      - name: Verify image
        run: docker image inspect nexacommerce/${{ matrix.service }}:latest

  test-compose:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: docker compose --profile production config -q
      - name: Build and start all services
        run: |
          docker compose --profile production up -d --build
          sleep 30
      - name: Health check gateway
        run: |
          curl -f http://localhost:3000/health || exit 1
      - name: Cleanup
        if: always()
        run: docker compose --profile production down -v
