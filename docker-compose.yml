services:
  # ─── Infrastructure (Selalu Aktif) ───

  postgres:
    image: postgres:16-alpine
    container_name: nexacommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: nexacommerce_db
    ports:
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexacommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexacommerce-network

  redis:
    image: redis:7-alpine
    container_name: nexacommerce-redis
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - nexacommerce-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nexacommerce-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - nexacommerce-network

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: nexacommerce-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - nexacommerce-network
    restart: unless-stopped

  # ─── Backend Services (Production Profile) ───

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: nexacommerce-gateway
    profiles: ["production"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
      - PRODUCT_SERVICE_URL=http://product-service:3003
      - CART_SERVICE_URL=http://cart-service:3004
      - ORDER_SERVICE_URL=http://order-service:3005
      - PAYMENT_SERVICE_URL=http://payment-service:3006
      - INVENTORY_SERVICE_URL=http://inventory-service:3007
      - VOUCHER_SERVICE_URL=http://voucher-service:3008
      - SHIPPING_SERVICE_URL=http://shipping-service:3009
      - REVIEW_SERVICE_URL=http://review-service:3010
      - NOTIFICATION_SERVICE_URL=http://notification-service:3011
      - ANALYTICS_SERVICE_URL=http://analytics-service:3012
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS is required}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: nexacommerce-auth
    profiles: ["production"]
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexacommerce_db?schema=auth
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - NOTIFICATION_SERVICE_URL=http://notification-service:3011
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: nexacommerce-user
    profiles: ["production"]
    expose:
      - "3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexacommerce_db?schema=users
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    container_name: nexacommerce-product
    profiles: ["production"]
    expose:
      - "3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexacommerce_db?schema=products
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - REVIEW_SERVICE_URL=http://review-service:3010
      - MEDIA_S3_BUCKET=${MEDIA_S3_BUCKET:?MEDIA_S3_BUCKET is required}
      - MEDIA_S3_REGION=${MEDIA_S3_REGION:-ap-southeast-1}
      - MEDIA_S3_ACCESS_KEY_ID=${MEDIA_S3_ACCESS_KEY_ID:?MEDIA_S3_ACCESS_KEY_ID is required}
      - MEDIA_S3_SECRET_ACCESS_KEY=${MEDIA_S3_SECRET_ACCESS_KEY:?MEDIA_S3_SECRET_ACCESS_KEY is required}
      - MEDIA_S3_ENDPOINT=${MEDIA_S3_ENDPOINT:-}
      - MEDIA_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL:?MEDIA_PUBLIC_BASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  cart-service:
    build:
      context: .
      dockerfile: apps/cart-service/Dockerfile
    container_name: nexacommerce-cart
    profiles: ["production"]
    expose:
      - "3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - PRODUCT_SERVICE_URL=http://product-service:3003
      - INVENTORY_SERVICE_URL=http://inventory-service:3007
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: nexacommerce-order
    profiles: ["production"]
    expose:
      - "3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexacommerce_db?schema=orders
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - CART_SERVICE_URL=http://cart-service:3004
      - PRODUCT_SERVICE_URL=http://product-service:3003
      - INVENTORY_SERVICE_URL=http://inventory-service:3007
      - USER_SERVICE_URL=http://user-service:3002
      - VOUCHER_SERVICE_URL=http://voucher-service:3008
      - PAYMENT_SERVICE_URL=http://payment-service:3006
      - SHIPPING_SERVICE_URL=http://shipping-service:3009
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    container_name: nexacommerce-payment
    profiles: ["production"]
    expose:
      - "3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexacommerce_db?schema=payments
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY:?MIDTRANS_SERVER_KEY is required}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY:?MIDTRANS_CLIENT_KEY is required}
      - MIDTRANS_MERCHANT_ID=${MIDTRANS_MERCHANT_ID:?MIDTRANS_MERCHANT_ID is required}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
      - ORDER_SERVICE_URL=http://order-service:3005
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    container_name: nexacommerce-inventory
    profiles: ["production"]
    expose:
      - "3007"
    environment:
      - NODE_ENV=production
      - PORT=3007
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexacommerce_db?schema=inventory
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - PRODUCT_SERVICE_URL=http://product-service:3003
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  voucher-service:
    build:
      context: .
      dockerfile: apps/voucher-service/Dockerfile
    container_name: nexacommerce-voucher
    profiles: ["production"]
    expose:
      - "3008"
    environment:
      - NODE_ENV=production
      - PORT=3008
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexacommerce_db?schema=vouchers
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  shipping-service:
    build:
      context: .
      dockerfile: apps/shipping-service/Dockerfile
    container_name: nexacommerce-shipping
    profiles: ["production"]
    expose:
      - "3009"
    environment:
      - NODE_ENV=production
      - PORT=3009
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexacommerce_db?schema=shipping
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - ORDER_SERVICE_URL=http://order-service:3005
      # Shipping quotes read the authoritative cart, the destination address,
      # the seller's verified dispatch origin, and product weights.
      - CART_SERVICE_URL=http://cart-service:3004
      - USER_SERVICE_URL=http://user-service:3002
      - PRODUCT_SERVICE_URL=http://product-service:3003
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  review-service:
    build:
      context: .
      dockerfile: apps/review-service/Dockerfile
    container_name: nexacommerce-review
    profiles: ["production"]
    expose:
      - "3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexacommerce_db?schema=reviews
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - ORDER_SERVICE_URL=http://order-service:3005
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: nexacommerce-notification
    profiles: ["production"]
    expose:
      - "3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexacommerce_db?schema=notifications
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
      - PRODUCT_SERVICE_URL=http://product-service:3003
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST is required}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:?SMTP_USER is required}
      - SMTP_PASS=${SMTP_PASS:?SMTP_PASS is required}
      - SMTP_FROM=${SMTP_FROM:?SMTP_FROM is required}
      - CUSTOMER_WEB_URL=${CUSTOMER_WEB_URL:?CUSTOMER_WEB_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: apps/analytics-service/Dockerfile
    container_name: nexacommerce-analytics
    profiles: ["production"]
    expose:
      - "3012"
    environment:
      - NODE_ENV=production
      - PORT=3012
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexacommerce_db?schema=analytics
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      # Kafka projection. The consumer group id is part of the replay contract:
      # changing it makes the projection rebuild from the start of the topic.
      - KAFKA_BROKERS=kafka:19092
      - KAFKA_CLIENT_ID=nexacommerce-analytics
      - KAFKA_TOPIC_PREFIX=${KAFKA_TOPIC_PREFIX:-nexacommerce}
      - KAFKA_PROJECTION_GROUP_ID=${KAFKA_PROJECTION_GROUP_ID:-analytics-daily-projection-v1}
      - ANALYTICS_DAILY_READ_MODEL=${ANALYTICS_DAILY_READ_MODEL:-RABBITMQ}
      - ANALYTICS_KAFKA_CUTOVER_WINDOW_DAYS=${ANALYTICS_KAFKA_CUTOVER_WINDOW_DAYS:-30}
      - ANALYTICS_RABBITMQ_CONSUMER_ENABLED=${ANALYTICS_RABBITMQ_CONSUMER_ENABLED:-true}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3003
      - ORDER_SERVICE_URL=http://order-service:3005
      - REVIEW_SERVICE_URL=http://review-service:3010
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

  event-stream-service:
    build:
      context: .
      dockerfile: apps/event-stream-service/Dockerfile
    container_name: nexacommerce-event-stream
    profiles: ["production"]
    expose:
      - "3013"
    environment:
      - NODE_ENV=production
      - PORT=3013
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
      - KAFKA_BROKERS=kafka:19092
      - KAFKA_CLIENT_ID=nexacommerce-event-stream
      - KAFKA_TOPIC_PREFIX=nexacommerce
      - KAFKA_REPLICATION_FACTOR=1
      - KAFKA_BRIDGE_RETRY_INTERVAL_MS=10000
      - KAFKA_BRIDGE_MAX_RETRIES=1000
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - nexacommerce-network
    restart: unless-stopped

networks:
  nexacommerce-network:
    name: nexacommerce-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
